name: Bug report
description: Something does not work as described
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Please never paste an API key. `localagent --doctor` output is the most helpful thing to include.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cd into a project with ...
        2. run `localagent --offline`
        3. ask "..."
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `localagent --doctor`
      render: text
  - type: input
    id: version
    attributes:
      label: Version and system
      placeholder: "localagent 0.6.0, Windows 11, installed from the zip"
    validations:
      required: true
