name: ci
on: [push, pull_request]
permissions:
  contents: read          # the checks only read the code; the token can do nothing else
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: windows-latest   # the main platform: line endings, PowerShell, process trees
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ruff mypy
      - run: ruff check localagent tests tools evals
      - run: mypy localagent evals tools
      - run: python -m unittest discover -s tests -t .
      - run: python tools/build_docs.py --check
