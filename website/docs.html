<div class="container docs-layout{{layout_class}}">
  <details class="sidebar" id="docs-nav" open>
    <summary>Documentation menu</summary>
    <nav aria-label="Documentation">
{{sidebar}}
    </nav>
  </details>
  <article class="prose">
    <ol class="breadcrumbs">{{breadcrumbs}}</ol>
{{content}}
    <nav class="pager" aria-label="Previous and next page">{{pager}}</nav>
  </article>
{{toc}}
</div>
